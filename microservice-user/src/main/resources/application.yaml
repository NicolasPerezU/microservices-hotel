spring:
  application:
    name: microservice-user
  config:
    import: "optional:configserver:http://localhost:8081"
  datasource:
    url: jdbc:mysql://localhost:3306/user
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    hibernate:
      ddl-auto: update

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 2000
        loggerLevel: basic
  circuitbreaker:
    enabled: true # Asegura que Feign integre Resilience4j